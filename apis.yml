name: Skipthedishes
description: >-
  SkipTheDishes is a Canadian online food-delivery marketplace headquartered in Winnipeg,
  Manitoba, founded in 2012 and acquired by Just Eat (now Just Eat Takeaway.com) in 2016,
  under which it operates as the group's Canadian brand. It connects diners with local
  restaurants and a network of independent couriers for on-demand food delivery and pickup
  across Canadian cities via its consumer website and mobile apps, and runs a restaurant
  partner onboarding program and a courier (Skip Network) program. As of this enrichment
  pass SkipTheDishes publishes no public developer API, developer portal, or API
  documentation. The primary domain is served behind Cloudflare bot protection and the
  partner/partners subdomains are static marketing/onboarding pages, so no OpenAPI, webhook,
  or SDK surface is available to harvest.
